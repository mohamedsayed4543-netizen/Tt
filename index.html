["الاختصار Ctrl + Enter يستخدم في Word لـ:","إدراج Page Break",["إغلاق الملف","فتح ملف","حفظ المستند"],"Ctrl+Enter يدرج فاصل صفحة ويبدأ صفحة جديدة."]
];
const AX=[
{n:"القرآن الكريم",s:"حدد السورة وأكمل الآية",d:QURAN},
{n:"المعلومات العامة",s:"المتحف المصري الكبير وأهداف التنمية المستدامة",d:GEN},
{n:"الحاسب الآلي",s:"Microsoft Word",d:COMP},
{n:"التنظيم والإدارة",s:"يُضاف قريبًا",d:[]}
];
const app=document.getElementById("app");
let ax,qs,i,score,wr,tm,t,locked;
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const prep=d=>d.map(([q,a,ds,e])=>({q,a,e,o:shuf([a,...ds])}));
function home(){
 clearInterval(tm);
 app.innerHTML=`<h1>محاكي مسابقة معلم مساعد</h1><p class="lead">اختر المحور. لكل سؤال 30 ثانية، والتصحيح فوري مع شرح للإجابة.</p>`+
 AX.map((a,k)=>`<button class="ax" onclick="start(${k})" ${a.d.length?"":"disabled"}><b>${a.n}</b><span>${a.s}${a.d.length?" — "+a.d.length+" سؤال":""}</span></button>`).join("");
}
function start(k){ax=AX[k];qs=shuf(prep(ax.d));i=0;score=0;wr=[];show()}
function show(){
 locked=false;const x=qs[i];
 app.innerHTML=`<div class="top"><span>${ax.n} — سؤال ${i+1} من ${qs.length}</span><span class="t" id="tn">30</span></div>
 <div class="barbox"><div id="bar"></div></div>
 <div class="q">${x.q}</div>
 <div id="os">${x.o.map((o,k)=>`<button class="o" onclick="pick(${k})"><bdi>${o}</bdi></button>`).join("")}</div>
 <div id="fb"></div>`;
 clock();
}
function clock(){
 clearInterval(tm);t=30;
 const b=document.getElementById("bar"),n=document.getElementById("tn");
 b.style.transition="none";b.style.width="100%";void b.offsetWidth;
 b.style.transition="width 30s linear";b.style.width="0";
 tm=setInterval(()=>{t--;n.textContent=t;if(t<=5)n.classList.add("low");if(t<=0)pick(-1)},1000);
}
function pick(k){
 if(locked)return;locked=true;clearInterval(tm);
 const b=document.getElementById("bar");b.style.width=getComputedStyle(b).width;b.style.transition="none";
 const x=qs[i],ok=k>=0&&x.o[k]===x.a;
 document.querySelectorAll(".o").forEach((e,j)=>{e.disabled=true;if(x.o[j]===x.a)e.classList.add("ok");else if(j===k)e.classList.add("no")});
 if(ok)score++;else wr.push(x);
 const last=i===qs.length-1;
 document.getElementById("fb").innerHTML=`<div class="msg ${ok?"ok":"no"}">${ok?"إجابة صحيحة":k<0?"انتهى الوقت":"إجابة خاطئة"}</div>
 <div class="row"><button class="b s" onclick="document.getElementById('ex').classList.toggle('on')">شرح</button><button class="b" onclick="next()">${last?"عرض النتيجة":"السؤال التالي"}</button></div>
 <div class="ex" id="ex"><b>الإجابة الصحيحة:</b> <bdi>${x.a}</bdi><br>${x.e}</div>`;
}
function next(){i++;if(i<qs.length)show();else result()}
function result(){
 const p=Math.round(score/qs.length*100);
 app.innerHTML=`<h1>نتيجتك في ${ax.n}</h1><p class="score">${score} / ${qs.length}</p><p class="lead">${p}% — ${p>=80?"مستواك ممتاز":p>=60?"مستواك جيد، راجع الأخطاء":"محتاج مراجعة أكتر، جرّب مرة تانية"}</p>
 <div class="row" style="margin-bottom:18px"><button class="b" onclick="start(${AX.indexOf(ax)})">إعادة المحور</button><button class="b s" onclick="home()">القائمة الرئيسية</button></div>
 ${wr.length?"<h3>أسئلة أخطأت فيها</h3>"+wr.map(x=>`<div class="wr">${x.q}<br><small>الإجابة: <bdi>${x.a}</bdi></small><br>${x.e}</div>`).join(""):"<p>لا توجد أخطاء. أحسنت!</p>"}`;
}
home();
</script>
</body>
</html>
